name: CI 파이프라인 (변경된 서비스만 빌드/푸시 + GitOps 태그 갱신)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      full_build:
        description: '전체 서비스 빌드/푸시 실행'
        type: boolean
        required: false
        default: false
  schedule:
    # 매일 새벽 3시(KST) = 18:00(UTC)
    - cron: '0 18 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.set-matrix.outputs.should_build }}
      services: ${{ steps.set-matrix.outputs.services }}
      ci_changed: ${{ steps.filter.outputs.ci }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:  # 히스토리 전체 받기. 
          fetch-depth: 0

      - name: 변경 파일 경로 감지
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # push 이벤트일 때는 “이번 push에서 바뀐 범위(github.event.before..github.sha)”만 비교
          # PR 이벤트일 때는 “PR의 base 커밋 ↔ head 커밋”을 비교
          # schedule/workflow_dispatch: 기본 브랜치 기준(참고용; 실제 빌드 대상은 FULL_BUILD로 결정)
          base: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
                github.event_name == 'push' && github.event.before ||
                github.event.repository.default_branch }}
          ref: ${{ github.sha }}
          filters: |
            auth_server:
              - 'auth_server/**'
              - 'common/**'
            employee_server:
              - 'employee_server/**'
              - 'common/**'
            gateway:
              - 'gateway/**'
            photo_service:
              - 'photo_service/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/workflows/**'

      - name: 변경된 서비스 목록 생성(매트릭스)
        id: set-matrix
        uses: actions/github-script@v7
        env:
          AUTH_CHANGED: ${{ steps.filter.outputs.auth_server }}
          EMPLOYEE_CHANGED: ${{ steps.filter.outputs.employee_server }}
          GATEWAY_CHANGED: ${{ steps.filter.outputs.gateway }}
          PHOTO_CHANGED: ${{ steps.filter.outputs.photo_service }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
          FULL_BUILD: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build) }}
        with:
          script: |
            const services = [];
            const add = (name, cond) => { if (cond === 'true') services.push(name); };

            // 스케줄/수동(full_build=true)일 때만 전체 빌드
            if (process.env.FULL_BUILD === 'true') {
              services.push('auth_server','employee_server','gateway','photo_service','frontend');
            } else {
              add('auth_server', process.env.AUTH_CHANGED);
              add('employee_server', process.env.EMPLOYEE_CHANGED);
              add('gateway', process.env.GATEWAY_CHANGED);
              add('photo_service', process.env.PHOTO_CHANGED);
              add('frontend', process.env.FRONTEND_CHANGED);
            }

            const unique = [...new Set(services)];
            const shouldBuild = unique.length > 0 ? 'true' : 'false';

            core.setOutput('should_build', shouldBuild);
            core.setOutput('services', JSON.stringify(unique));

      - name: 변경 감지 결과 요약 출력
        run: |
          echo "## 변경 감지 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- auth_server: **${{ steps.filter.outputs.auth_server }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- employee_server: **${{ steps.filter.outputs.employee_server }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- gateway: **${{ steps.filter.outputs.gateway }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- photo_service: **${{ steps.filter.outputs.photo_service }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend: **${{ steps.filter.outputs.frontend }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- workflows(ci): **${{ steps.filter.outputs.ci }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 최종 빌드 대상 서비스" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- services: \`${{ steps.set-matrix.outputs.services }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- should_build: **${{ steps.set-matrix.outputs.should_build }}**" >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: 워크플로우 린트(변경 시)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.ci_changed == 'true'
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: actionlint 실행
        uses: rhysd/actionlint@v1.7.10

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
      max-parallel: 1
    
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      
      - name: Docker 빌드 환경 설정(Buildx)
        uses: docker/setup-buildx-action@v2
      
      - name: GHCR 로그인(푸시 이벤트만)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 이미지 태그 생성(브랜치/SHA)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch    
            # PR 등 일부 이벤트에서는 {{branch}}가 비어 "-<sha>"가 될 수 있어, 항상 안전한 접두어 사용
            type=sha,prefix=sha-,format=short
      
      - name: 이미지 빌드 및 푸시(푸시 이벤트만)
        uses: docker/build-push-action@v4
        with:
          context: . # 현재 디렉토리(저장소 루트)
          file: ./${{ matrix.service }}/Dockerfile 
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: GitOps 저장소 체크아웃(dev/main 푸시 이벤트만)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/BABAMBA-gitops
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GIT }}
          path: BABAMBA-gitops

      - name: GitOps 매니페스트 이미지 태그 갱신(dev/main 푸시 이벤트만)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          cd BABAMBA-gitops
          
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          NEW_TAG="sha-${GITHUB_SHA::7}"
          IMAGE_NAME="${REGISTRY}/${IMAGE_NAMESPACE}/${SERVICE_NAME}"

          # 리모트 최신 상태를 먼저 가져온 뒤(필요 시 autostash) 매니페스트를 수정해야 rebase가 막히지 않음
          git pull --rebase --autostash origin "${TARGET_BRANCH}"
          
          # 서비스 이름 매핑 (gitops의 파일명과 일치시키기)
          case "$SERVICE_NAME" in
            auth_server)
              MANIFEST_FILE="workloads/k8s/auth.yaml"
              ;;
            employee_server)
              MANIFEST_FILE="workloads/k8s/employee.yaml"
              ;;
            gateway)
              MANIFEST_FILE="workloads/k8s/gateway.yaml"
              ;;
            photo_service)
              MANIFEST_FILE="workloads/k8s/photo.yaml"
              ;;
            frontend)
              MANIFEST_FILE="workloads/k8s/nginx.yaml"
              ;;
          esac
          
          # 매니페스트 파일의 이미지 태그 업데이트
          if [ -f "$MANIFEST_FILE" ]; then
            # 첫 번째 image: 라인만 교체 (기존 레지스트리/계정명과 무관하게 안전하게 업데이트)
            sed -i "0,/^[[:space:]]*image:/s|^\([[:space:]]*image:[[:space:]]*\).*|\1${IMAGE_NAME}:${NEW_TAG}|" "$MANIFEST_FILE"
            
            # 변경사항 커밋 및 푸시
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST_FILE"
            git commit -m "배포(${TARGET_BRANCH}): ${SERVICE_NAME} 이미지 태그를 ${NEW_TAG}으로 갱신" || exit 0
            git push origin "${TARGET_BRANCH}"
          fi