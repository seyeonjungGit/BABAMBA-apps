name: CI 파이프라인 (변경된 서비스만 빌드/푸시 + GitOps 태그 갱신)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      full_build:
        description: '전체 서비스 빌드/푸시 실행'
        type: boolean
        required: false
        default: false
  schedule:
    # 매일 새벽 3시(KST) = 18:00(UTC)
    - cron: '0 18 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.set-matrix.outputs.should_build }}
      services: ${{ steps.set-matrix.outputs.services }}
      ci_changed: ${{ steps.filter.outputs.ci }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경 파일 경로 감지
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
                github.event_name == 'push' && github.event.before ||
                github.event.repository.default_branch }}
          ref: ${{ github.sha }}
          filters: |
            auth_server:
              - 'auth_server/**'
              - 'common/**'
            employee_server:
              - 'employee_server/**'
              - 'common/**'
            gateway:
              - 'gateway/**'
            photo_service:
              - 'photo_service/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/workflows/**'

      - name: 변경된 서비스 목록 생성(매트릭스)
        id: set-matrix
        uses: actions/github-script@v7
        env:
          AUTH_CHANGED: ${{ steps.filter.outputs.auth_server }}
          EMPLOYEE_CHANGED: ${{ steps.filter.outputs.employee_server }}
          GATEWAY_CHANGED: ${{ steps.filter.outputs.gateway }}
          PHOTO_CHANGED: ${{ steps.filter.outputs.photo_service }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
          FULL_BUILD: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build) }}
        with:
          script: |
            const services = [];
            const add = (name, cond) => { if (cond === 'true') services.push(name); };

            if (process.env.FULL_BUILD === 'true') {
              services.push('auth_server','employee_server','gateway','photo_service','frontend');
            } else {
              add('auth_server', process.env.AUTH_CHANGED);
              add('employee_server', process.env.EMPLOYEE_CHANGED);
              add('gateway', process.env.GATEWAY_CHANGED);
              add('photo_service', process.env.PHOTO_CHANGED);
              add('frontend', process.env.FRONTEND_CHANGED);
            }

            const unique = [...new Set(services)];
            const shouldBuild = unique.length > 0 ? 'true' : 'false';

            core.setOutput('should_build', shouldBuild);
            core.setOutput('services', JSON.stringify(unique));

      - name: 변경 감지 결과 요약 출력
        run: |
          {
            echo "## 변경 감지 결과"
            echo ""
            echo "- auth_server: **${{ steps.filter.outputs.auth_server }}**"
            echo "- employee_server: **${{ steps.filter.outputs.employee_server }}**"
            echo "- gateway: **${{ steps.filter.outputs.gateway }}**"
            echo "- photo_service: **${{ steps.filter.outputs.photo_service }}**"
            echo "- frontend: **${{ steps.filter.outputs.frontend }}**"
            echo "- workflows(ci): **${{ steps.filter.outputs.ci }}**"
            echo ""
            echo "## 최종 빌드 대상 서비스"
            echo ""
            echo "- services: \`${{ steps.set-matrix.outputs.services }}\`"
            echo "- should_build: **${{ steps.set-matrix.outputs.should_build }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: 워크플로우 린트(변경 시)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.ci_changed == 'true'
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: actionlint 실행
        uses: rhysd/actionlint@v1.7.10

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
      max-parallel: 1
    
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      
      - name: Docker 빌드 환경 설정(Buildx)
        uses: docker/setup-buildx-action@v3
      
      - name: GHCR 로그인(푸시 이벤트만)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      
      - name: 이미지 태그 생성(브랜치/SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
      
      - name: 이미지 빌드 및 푸시(푸시 이벤트만)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: GitOps 저장소 체크아웃(dev/main 푸시 이벤트만)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/BABAMBA-gitops
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          path: BABAMBA-gitops

      - name: GitOps 매니페스트 이미지 태그 갱신(dev/main 푸시 이벤트만)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          cd BABAMBA-gitops
          
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          NEW_TAG="sha-${GITHUB_SHA::7}"
          IMAGE_NAME="${REGISTRY}/${IMAGE_NAMESPACE}/${SERVICE_NAME}"

          git pull --rebase --autostash origin "${TARGET_BRANCH}"
          
          # 서비스명을 GitOps 디렉토리명으로 매핑
          case "$SERVICE_NAME" in
            auth_server) K8S_DIR="auth" ;;
            employee_server) K8S_DIR="employee" ;;
            gateway) K8S_DIR="gateway" ;;
            photo_service) K8S_DIR="photo" ;;
            frontend) K8S_DIR="nginx" ;;
            *) echo "알 수 없는 서비스: $SERVICE_NAME" && exit 1 ;;
          esac
          
          # 브랜치별 매니페스트 파일 경로 설정
          # main 브랜치: clusters/onprem/dev/apps/{디렉토리}/values.yaml"
          # dev 브랜치: clusters/onprem/dev/apps/{디렉토리}/values.yaml"
          if [ "${TARGET_BRANCH}" = "main" ]; then
            MANIFEST_FILE="clusters/onprem/prod/apps/${K8S_DIR}/values.yaml"
          else
            MANIFEST_FILE="clusters/onprem/dev/apps/${K8S_DIR}/values.yaml"
          fi
          
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i "0,/^[[:space:]]*image:/s|^\([[:space:]]*image:[[:space:]]*\).*|\1${IMAGE_NAME}:${NEW_TAG}|" "$MANIFEST_FILE"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST_FILE"
            git commit -m "배포(${TARGET_BRANCH}): ${SERVICE_NAME} 이미지 태그를 ${NEW_TAG}으로 갱신" || exit 0
            git push origin "${TARGET_BRANCH}"
          fi
